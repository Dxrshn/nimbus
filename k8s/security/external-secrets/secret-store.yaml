apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: localstack
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      endpoint: http://localstack:4566
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
