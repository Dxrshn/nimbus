apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: nimbus-dev-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: nimbus-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: nimbus-dev
  tags:
    Project: nimbus
    Environment: dev
    ManagedBy: karpenter
