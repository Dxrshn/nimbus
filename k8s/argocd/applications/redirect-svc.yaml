apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redirect-svc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dxrshn/nimbus.git
    targetRevision: main
    path: apps/redirect-svc/helm
    helm:
      valueFiles:
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nimbus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
