apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  labels:
    app: analytics-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      containers:
        - name: analytics-worker
          image: nimbus/analytics-worker:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: database-url
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: sqs-queue-url
            - name: SQS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: sqs-endpoint
