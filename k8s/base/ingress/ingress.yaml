apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nimbus
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: shortener-api
                port:
                  number: 80
          - path: /r(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: redirect-svc
                port:
                  number: 80
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dashboard-ui
                port:
                  number: 80
