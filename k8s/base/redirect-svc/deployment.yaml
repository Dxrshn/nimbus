apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect-svc
  labels:
    app: redirect-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redirect-svc
  template:
    metadata:
      labels:
        app: redirect-svc
    spec:
      containers:
        - name: redirect-svc
          image: nimbus/redirect-svc:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: redis-url
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: sqs-queue-url
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
