replicaCount: 1

image:
  repository: nimbus/redirect-svc
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

secretName: nimbus-secrets

livenessProbe:
  path: /health
  port: 8080

readinessProbe:
  path: /ready
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
