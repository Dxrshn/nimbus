name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-shortener-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/shortener-api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run tests
        run: |
          cd apps/shortener-api
          pytest tests/

  test-redirect-svc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run tests
        run: |
          cd apps/redirect-svc
          go test ./...

  build:
    runs-on: ubuntu-latest
    needs: [test-shortener-api, test-redirect-svc]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build shortener-api
        uses: docker/build-push-action@v6
        with:
          context: apps/shortener-api
          push: false
          tags: nimbus/shortener-api:${{ github.sha }}

      - name: Build redirect-svc
        uses: docker/build-push-action@v6
        with:
          context: apps/redirect-svc
          push: false
          tags: nimbus/redirect-svc:${{ github.sha }}

      - name: Build analytics-worker
        uses: docker/build-push-action@v6
        with:
          context: apps/analytics-worker
          push: false
          tags: nimbus/analytics-worker:${{ github.sha }}

      - name: Build dashboard-ui
        uses: docker/build-push-action@v6
        with:
          context: apps/dashboard-ui
          push: false
          tags: nimbus/dashboard-ui:${{ github.sha }}
