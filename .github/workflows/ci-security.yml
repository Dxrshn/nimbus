name: Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [shortener-api, redirect-svc, analytics-worker, dashboard-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nimbus/${{ matrix.service }}:scan apps/${{ matrix.service }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nimbus/${{ matrix.service }}:scan
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  trivy-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
